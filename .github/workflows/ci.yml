name: ci

# ============================================================
# 流水线：验证 → 构建推送 ghcr.io → 冒烟测试
#
#   test    起假爱快 + 真 server 跑后端回归，再用 DOM 桩跑前端回归
#   build   仅当 test 全绿才构建镜像并推到 ghcr.io（PR 不推）
#   smoke   把刚推上去的镜像真拉下来起容器，探活 + 校验静态资源
#
# 也就是说：验证没过 = 不会产出镜像；镜像产出后还要自己先跑得起来。
# ============================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 读代码 + 推包（推 ghcr.io 用 GITHUB_TOKEN，不需要额外配 secret）
permissions:
  contents: read
  packages: write

env:
  # ghcr 要求镜像名全小写
  IMAGE: ghcr.io/utterliar1/idocker

# 同一分支连推多次时，取消上一次还没跑完的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 1. 验证
  # ------------------------------------------------------------
  test:
    name: 验证 · 后端 + 前端回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 准备 Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 准备 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 代码本体是纯标准库 / 零依赖，所以这里刻意不装任何第三方包 ——
      # 装了反而会掩盖「运行时其实不需要 pip」这个设计前提。
      - name: 全量语法自检
        run: python -m compileall -q webapp/app _test

      - name: 后端回归（假爱快 + 真 server，131 项）
        run: python _test/test_webapp.py

      - name: 前端回归 · 自动刷新（DOM 桩跑真 app.js，24 项）
        run: node _test/test_frontend.js

      - name: 前端回归 · 交互与状态呈现（DOM 桩跑真 app.js，39 项）
        run: node _test/test_frontend_ux.js

  # ------------------------------------------------------------
  # 2. 构建并推送 ghcr.io（test 绿了才跑，PR 不推）
  # ------------------------------------------------------------
  build:
    name: 构建 · 推送 ghcr.io
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # 给冒烟测试用的确定性标签（metadata-action 的 type=sha,format=short 产物）
      smoke_ref: ${{ steps.shortsha.outputs.ref }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 记下本次的短 sha 标签
        id: shortsha
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: ./webapp
          # 飞牛 NAS / 主流 x86 设备都是 amd64；
          # 若要在 arm64 设备（树莓派等）上跑，这里加 ,linux/arm64 即可（走 QEMU，会慢些）。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 打 tag 时注入 git tag 当版本号；分支构建标记为 dev。
          # 镜像上还会带 org.opencontainers.image.revision = 完整 commit sha。
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入构建摘要
        run: |
          {
            echo "### 已推送到 ghcr.io"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "- 架构：linux/amd64"
            echo "- 短 sha：\`${{ steps.shortsha.outputs.ref }}\`"
            echo "- base：\`python:3.13-alpine\`（Dockerfile 默认，CI 走官方源）"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------
  # 3. 冒烟测试：把刚推上去的镜像真跑起来
  # ------------------------------------------------------------
  smoke:
    name: 冒烟 · 真拉真起真探活
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 登录 ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉起容器
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.smoke_ref }}"
          echo "被测镜像：$IMG"
          docker pull "$IMG"
          # 爱快地址故意指向一个连不通的端口：验证「爱快不可达时服务照样起得来」。
          # 不设 AUTH_USER = 关闭网页认证，方便直接探活。
          docker run -d --name smoke -p 18088:8088 \
            -e IKUAI_URL=http://127.0.0.1:1 \
            -e IKUAI_USER=ci -e IKUAI_PASS=ci-only \
            -e REGISTRIES=http://127.0.0.1:1 \
            -e HTTP_TIMEOUT=3 \
            "$IMG"

      - name: 探活 /api/health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18088/api/health; then
              echo "第 $i 次探活通过"
              curl -fsS http://127.0.0.1:18088/api/health; echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::30 次探活均失败"
          docker logs smoke 2>&1 | tail -40
          exit 1

      - name: 首页与静态资源能正常返回
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:18088/ | grep -q "爱快 Docker 容器更新器"
          curl -fsS -o /dev/null http://127.0.0.1:18088/static/app.js
          curl -fsS -o /dev/null http://127.0.0.1:18088/static/style.css
          echo "首页 + app.js + style.css 均 200"

      # 前端资源漏打是最隐蔽的一类构建事故：页面能开，但少了新加的控件，
      # 用户看到的就是「功能没了」。这里对着真容器确认关键钩子都在。
      - name: 页面里该有的控件都在
        run: |
          set -euo pipefail
          page=$(curl -fsS http://127.0.0.1:18088/)
          for id in updBar updStat btnUpdateAll btnCheckInline cfmModal toastWrap; do
            grep -q "id=\"$id\"" <<< "$page" \
              || { echo "::error::首页缺少控件 #$id"; exit 1; }
          done
          echo "概览条 / 一键更新 / 确认框 / 轻提示 的元素都在"
          js=$(curl -fsS http://127.0.0.1:18088/static/app.js)
          for fn in confirmUpdate updatableContainers renderUpdBar maybeAutoCheck; do
            grep -q "$fn" <<< "$js" \
              || { echo "::error::app.js 缺少函数 $fn"; exit 1; }
          done
          css=$(curl -fsS http://127.0.0.1:18088/static/style.css)
          grep -q "prefers-color-scheme: dark" <<< "$css" \
            || { echo "::error::style.css 缺少深色主题"; exit 1; }
          echo "app.js 新函数与深色主题样式均在"

      - name: 容器自带健康检查脚本能通过
        run: docker exec smoke python healthcheck.py

      - name: 确认非 root 运行
        run: |
          set -euo pipefail
          whoami=$(docker exec smoke id -un)
          echo "容器内用户：$whoami"
          test "$whoami" = "appuser"

      # 访问认证走「登录页 + 表单 + 会话 cookie」，而不是 HTTP Basic 原生弹窗 ——
      # 原生弹窗密码管理器识别不了，没法自动填充。这里用真容器把整条链路跑一遍。
      - name: 访问认证 · 登录页与会话 cookie
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.smoke_ref }}"
          B=http://127.0.0.1:18089
          docker run -d --name smoke-auth -p 18089:8088 \
            -e IKUAI_URL=http://127.0.0.1:1 \
            -e IKUAI_USER=ci -e IKUAI_PASS=ci-only \
            -e REGISTRIES=http://127.0.0.1:1 \
            -e HTTP_TIMEOUT=3 \
            -e AUTH_USER=admin -e AUTH_PASS=ci-pw-only \
            "$IMG"
          up=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$B/login"; then echo "第 $i 次探活通过"; up=1; break; fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "::error::带认证的容器 30 次探活均失败"
            docker logs smoke-auth 2>&1 | tail -40
            exit 1
          fi

          echo "--- 登录页要素 ---"
          page=$(curl -fsS "$B/login")
          grep -q '<form method="post" action="/api/login"' <<< "$page" \
            || { echo "::error::登录页没有真实 form 表单"; exit 1; }
          grep -q 'autocomplete="username"' <<< "$page" \
            || { echo "::error::账号框缺少 autocomplete=username"; exit 1; }
          grep -q 'autocomplete="current-password"' <<< "$page" \
            || { echo "::error::密码框缺少 autocomplete=current-password"; exit 1; }
          echo "form + username + current-password 均在（密码管理器可识别、可自动填充）"

          echo "--- 未登录时的行为 ---"
          hdrs=$(curl -sS -o /dev/null -D - "$B/api/health" | tr -d '\r')
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$B/api/health")" = "401" \
            || { echo "::error::未登录调接口没有返回 401"; exit 1; }
          if grep -qi '^www-authenticate:' <<< "$hdrs"; then
            echo "::error::下发了 WWW-Authenticate，浏览器又会弹原生账号框"; exit 1
          fi
          loc=$(curl -sS -o /dev/null -D - "$B/" | tr -d '\r' \
                | awk 'tolower($1)=="location:"{print $2}')
          test "$loc" = "/login?next=/" \
            || { echo "::error::未登录访问首页没有跳登录页，实际：$loc"; exit 1; }
          echo "接口 401（无 WWW-Authenticate）、页面跳 /login"

          echo "--- 密码错误 ---"
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
                 -d 'username=admin&password=wrong&next=/' "$B/api/login")" = "401" \
            || { echo "::error::密码错误竟然放行"; exit 1; }

          echo "--- 登录成功 ---"
          curl -sS -c /tmp/ck.txt -o /dev/null \
            -d 'username=admin&password=ci-pw-only&next=/' "$B/api/login"
          grep -q idocker_session /tmp/ck.txt \
            || { echo "::error::登录成功后没有下发会话 cookie"; cat /tmp/ck.txt; exit 1; }
          test "$(curl -sS -b /tmp/ck.txt -o /dev/null -w '%{http_code}' "$B/api/health")" = "200" \
            || { echo "::error::带会话 cookie 仍无法访问接口"; exit 1; }
          echo "会话 cookie 可用；退出后 cookie 被清掉"
          curl -sS -b /tmp/ck.txt -c /tmp/ck2.txt -o /dev/null -X POST "$B/api/logout"
          curl -sS -b /tmp/ck2.txt -o /dev/null -w '%{http_code}\n' "$B/api/health" | grep -q 401 \
            || { echo "::warning::退出后 cookie 看起来还在"; }

          echo "--- Basic 头兼容 ---"
          test "$(curl -sS -u admin:ci-pw-only -o /dev/null -w '%{http_code}' "$B/api/health")" = "200" \
            || { echo "::error::Basic 头被破坏了（脚本/CI 会受影响）"; exit 1; }
          echo "Authorization: Basic 仍然可用"

      - name: 失败时 dump 容器日志
        if: failure()
        run: |
          docker logs smoke 2>&1 | tail -60 || true
          docker logs smoke-auth 2>&1 | tail -60 || true
